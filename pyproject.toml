[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "network-science-toolkit"
version = "0.1.0"
description = "A small network science toolkit"
requires-python = ">=3.9"
dependencies = ["networkx", "matplotlib"]

[tool.setuptools]
py-modules = ["network_toolkit"]
